apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-platform-root
  namespace: argocd
spec:
  project: bootstrap

  source:
    repoURL: https://github.com/anselem-okeke/sre-decision-intelligence-gitops.git
    targetRevision: main
    path: argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true