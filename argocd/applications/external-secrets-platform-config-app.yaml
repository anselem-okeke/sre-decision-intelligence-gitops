apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-platform-config
  namespace: argocd
spec:
  project: platform-security

  source:
    repoURL: https://github.com/anselem-okeke/sre-decision-intelligence-gitops.git
    targetRevision: main
    path: platform/external-secrets/config

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
