apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: observability

  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.48.5
    helm:
      values: |
        kind: DaemonSet

        serviceAccount:
          create: true

        luaScripts:
          normalize.lua: |
            function normalize(tag, timestamp, record)
                local raw = record["message"] or record["log"] or ""

                if raw == nil then
                    raw = ""
                end

                raw = tostring(raw)
                raw = raw:gsub("\n", "")
                raw = raw:gsub("\r", "")

                local severity = "INFO"
                local message = raw

                -- Match common log levels at the beginning of the line
                local detected, rest = raw:match("^(INFO)%s+(.+)")
                if detected then
                    severity = detected
                    message = rest
                end

                detected, rest = raw:match("^(WARN)%s+(.+)")
                if detected then
                    severity = detected
                    message = rest
                end

                detected, rest = raw:match("^(WARNING)%s+(.+)")
                if detected then
                    severity = detected
                    message = rest
                end

                detected, rest = raw:match("^(ERROR)%s+(.+)")
                if detected then
                    severity = detected
                    message = rest
                end

                detected, rest = raw:match("^(DEBUG)%s+(.+)")
                if detected then
                    severity = detected
                    message = rest
                end

                detected, rest = raw:match("^(CRITICAL)%s+(.+)")
                if detected then
                    severity = detected
                    message = rest
                end

                -- Also detect severity anywhere in the message as fallback
                if raw:find("ERROR") then
                    severity = "ERROR"
                elseif raw:find("WARN") then
                    severity = "WARN"
                elseif raw:find("CRITICAL") then
                    severity = "CRITICAL"
                elseif raw:find("DEBUG") then
                    severity = "DEBUG"
                elseif raw:find("INFO") then
                    severity = "INFO"
                end

                record["message"] = message
                record["severity"] = severity

                -- Human-readable timestamp field for _source display
                record["timestamp"] = os.date("!%Y-%m-%d %H:%M:%S")

                return 1, timestamp, record
            end

        config:
          service: |
            [SERVICE]
                Flush         5
                Log_Level     info
                Daemon        off
                Parsers_File  /fluent-bit/etc/parsers.conf
                HTTP_Server   On
                HTTP_Listen   0.0.0.0
                HTTP_Port     2020

          inputs: |
            [INPUT]
                Name              tail
                Path              /var/log/containers/*.log
                Exclude_Path      /var/log/containers/*_observability_fluent-bit-*.log
                Parser            cri
                Tag               kube.*
                Refresh_Interval  5
                Mem_Buf_Limit     50MB
                Skip_Long_Lines   On

          filters: |
            [FILTER]
                Name                kubernetes
                Match               kube.*
                Kube_URL            https://kubernetes.default.svc:443
                Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
                Merge_Log           On
                Keep_Log            On
                K8S-Logging.Parser  Off
                K8S-Logging.Exclude Off

            [FILTER]
                Name          lua
                Match         kube.*
                script        /fluent-bit/scripts/normalize.lua
                call          normalize

          outputs: |
            [OUTPUT]
                Name                  opensearch
                Match                 kube.*
                Host                  opensearch-cluster-master.observability.svc.cluster.local
                Port                  9200
                Logstash_Format       On
                Logstash_Prefix       k8s-logs
                Suppress_Type_Name    On
                tls                   Off
                Buffer_Size           512KB
                Retry_Limit           False

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true































