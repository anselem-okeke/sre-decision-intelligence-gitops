apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: observability

  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.48.5
    helm:
      values: |
        kind: DaemonSet

        serviceAccount:
          create: true

        config:
          service: |
            [SERVICE]
                Flush         5
                Log_Level     info
                Daemon        off
                Parsers_File  parsers.conf
                HTTP_Server   On
                HTTP_Listen   0.0.0.0
                HTTP_Port     2020

          inputs: |
            [INPUT]
                Name              tail
                Path              /var/log/containers/*.log
                Parser            cri
                Tag               kube.*
                Refresh_Interval  5
                Mem_Buf_Limit     50MB
                Skip_Long_Lines   On

          filters: |
            [FILTER]
                Name                kubernetes
                Match               kube.*
                Kube_URL            https://kubernetes.default.svc:443
                Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
                Merge_Log           On
                Keep_Log            On
                K8S-Logging.Parser  On
                K8S-Logging.Exclude Off

            [FILTER]
                Name          parser
                Match         kube.*
                Key_Name      log
                Parser        app_json
                Reserve_Data  On
                Preserve_Key  On

          outputs: |
            [OUTPUT]
                Name                  opensearch
                Match                 kube.*
                Host                  opensearch-cluster-master.observability.svc.cluster.local
                Port                  9200
                Logstash_Format       On
                Logstash_Prefix       k8s-logs
                Suppress_Type_Name    On
                tls                   Off

          customParsers: |
            [PARSER]
                Name        app_json
                Format      json
                Time_Key    timestamp
                Time_Keep   On

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true



























