apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: observability

  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.48.5
    helm:
      values: |
        kind: DaemonSet

        serviceAccount:
          create: true

        luaScripts:
          normalize.lua: |
            function normalize(tag, timestamp, record)
                local raw = record["message"] or record["log"] or ""

                if raw == nil then
                    raw = ""
                end

                raw = tostring(raw)
                raw = raw:gsub("\n", "")
                raw = raw:gsub("\r", "")

                local severity = "INFO"
                local message = raw
                local app_timestamp = nil

                local json_ts = raw:match('"timestamp"%s*:%s*"([^"]+)"')
                local json_msg = raw:match('"message"%s*:%s*"([^"]+)"')
                local json_sev = raw:match('"severity"%s*:%s*"([^"]+)"')

                if json_msg then
                    message = json_msg
                end

                if json_sev then
                    severity = json_sev
                end

                if json_ts then
                    app_timestamp = json_ts
                end

                if not json_msg then
                    if raw:find("CRITICAL") then
                        severity = "CRITICAL"
                    elseif raw:find("ERROR") then
                        severity = "ERROR"
                    elseif raw:find("WARN") or raw:find("WARNING") then
                        severity = "WARN"
                    elseif raw:find("DEBUG") then
                        severity = "DEBUG"
                    elseif raw:find("INFO") then
                        severity = "INFO"
                    end

                    message = message:gsub("^INFO%s+", "")
                    message = message:gsub("^WARN%s+", "")
                    message = message:gsub("^WARNING%s+", "")
                    message = message:gsub("^ERROR%s+", "")
                    message = message:gsub("^DEBUG%s+", "")
                    message = message:gsub("^CRITICAL%s+", "")
                end

                record["message"] = message
                record["severity"] = severity

                if app_timestamp then
                    record["timestamp"] = app_timestamp
                else
                    record["timestamp"] = os.date("!%Y-%m-%d %H:%M:%S")
                end

                return 1, timestamp, record
            end

        config:
          service: |
            [SERVICE]
                Flush                     5
                Log_Level                 info
                Daemon                    off
                Parsers_File              /fluent-bit/etc/parsers.conf
                HTTP_Server               On
                HTTP_Listen               0.0.0.0
                HTTP_Port                 2020
                storage.path              /var/log/flb-storage
                storage.sync              normal
                storage.checksum          off
                storage.backlog.mem_limit 100M
                storage.max_chunks_up     256

          inputs: |
            [INPUT]
                Name                tail
                Path                /var/log/containers/*.log
                Exclude_Path        /var/log/containers/*_observability_fluent-bit-*.log
                Parser              cri
                Tag                 kube.*
                Refresh_Interval    5
                Mem_Buf_Limit       256MB
                Skip_Long_Lines     On
                Read_from_Head      Off
                DB                  /var/log/flb_kube_cluster.db
                DB.Sync             Normal
                Rotate_Wait         60
                storage.type        filesystem

          filters: |
            [FILTER]
                Name                kubernetes
                Match               kube.*
                Kube_URL            https://kubernetes.default.svc:443
                Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
                Merge_Log           On
                Keep_Log            On
                K8S-Logging.Parser  Off
                K8S-Logging.Exclude Off

            [FILTER]
                Name                lua
                Match               kube.*
                script              /fluent-bit/scripts/normalize.lua
                call                normalize

          outputs: |
            [OUTPUT]
                Name                opensearch
                Match               kube.*
                Host                opensearch-cluster-master.observability.svc.cluster.local
                Port                9200
                Logstash_Format     On
                Logstash_Prefix     k8s-logs
                Suppress_Type_Name  On
                tls                 Off
                Buffer_Size         5M
                Workers             1
                Retry_Limit         False
                Trace_Error         On

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true































