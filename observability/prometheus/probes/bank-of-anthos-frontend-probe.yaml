apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: bank-of-anthos-frontend
  namespace: monitoring
  labels:
    release: kps
spec:
  jobName: bank-of-anthos-frontend
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://frontend.fintech-workload.svc.cluster.local
