config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions:
          - HTTP/1.1
          - HTTP/2.0
        valid_status_codes: []
        method: GET
        follow_redirects: true
        preferred_ip_protocol: ip4

service:
  port: 9115

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
